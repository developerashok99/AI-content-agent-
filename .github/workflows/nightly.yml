name: Nightly gaming Reel script

on:
  schedule:
    # 21:30 UTC ≈ 03:00 IST — adjust to taste
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.pipeline

      - name: Commit updated state and history
        run: |
          git config user.name "gaming-reel-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_articles.json state/telegram_offset.json docs/data/history.json
          git diff --staged --quiet || git commit -m "Update state, offset, and history [skip ci]"
          git push
